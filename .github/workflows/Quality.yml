name: Quality

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  format:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v5

    - name: Setup Biome
      uses: biomejs/setup-biome@v2
      with:
        version: 2.5.4

    - name: Format check
      run: biome format .

  web-lint:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v5

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.26.0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml

    - name: Install dependencies
      working-directory: web
      run: pnpm install --frozen-lockfile --ignore-workspace

    - name: Lint
      working-directory: web
      run: pnpm lint:check
