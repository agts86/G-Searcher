name: Build and deploy container to Azure Web App - line-web-hook-api

on:
  push:
    branches:
      - develop
    paths:
      - "API/**"
      - ".github/workflows/**"
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: line-webhook-api
  AZURE_WEBAPP_SLOT: Production
  IMAGE_NAME: line-webhook-api
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/line-webhook-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-uri: ${{ steps.push.outputs.image-uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        id: push
        run: |
          IMAGE_TAG=${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          docker build API -f API/Dockerfile -t $IMAGE_TAG
          docker push $IMAGE_TAG
          echo "IMAGE_URI=$IMAGE_TAG" >> $GITHUB_ENV
          echo "image-uri=$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_66E085E0FB724F6B8D456EC67F2148F7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_93108C5E37134A96B342478DAA227AC5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AB1DAF1410C34B939B79B31E4779DAF7 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: ${{ env.AZURE_WEBAPP_SLOT }}
          resource-group-name: resouce-linux
          images: ${{ needs.build.outputs.image-uri }}
