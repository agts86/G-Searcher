# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: ApiUniTest

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies
      run: dotnet restore ./API/LineWebHookAPI.sln
    - name: Build
      run: dotnet build ./API/LineWebHookAPI.sln --no-restore
    - name: Test
      run: dotnet test ./API/LineWebHookAPI.sln --no-build --verbosity normal
