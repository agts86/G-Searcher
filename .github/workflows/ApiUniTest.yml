name: ApiUniTest

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore ./API/LineWebHookAPI.sln

    - name: Build
      run: dotnet build ./API/LineWebHookAPI.sln --no-restore

    - name: Run tests with coverage
      run: dotnet test ./API/LineWebHookAPI.sln --no-build --verbosity normal --collect:"XPlat Code Coverage"

    - name: Install ReportGenerator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool

    - name: Generate coverage report
      run: |
        reportgenerator -reports:**/TestResults/*/coverage.cobertura.xml \
                        -targetdir:./API/CoverageReport \
                        -reporttypes:Html

    - name: Deploy coverage report to GitHub Pages
      if: github.ref == 'refs/heads/develop'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./API/CoverageReport
