name: ApiUnitTest

on:
  push:
    branches: [ "develop" ]
    paths:
      - 'api-ts/**'
      - '.github/workflows/ApiUniTest.yml'
  pull_request:
    branches: [ "develop" ]
    paths:
      - 'api-ts/**'
      - '.github/workflows/ApiUniTest.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public&sslmode=disable

    steps:
    - uses: actions/checkout@v5

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.26.0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: api-ts/pnpm-lock.yaml

    - name: Install dependencies
      working-directory: api-ts
      run: pnpm install --frozen-lockfile

    - name: Sync DB schema
      # prisma migrateは使わない（EF Coreがスキーマの記録上の所有者のため）。
      # schema.prismaの内容をそのままCI用の使い捨てDBへ反映するだけのdb pushを使う。
      working-directory: api-ts
      run: pnpm --filter @api-ts/tables exec prisma db push --skip-generate

    - name: Build
      working-directory: api-ts
      run: pnpm -r build

    - name: Lint
      working-directory: api-ts
      run: pnpm -r lint

    - name: Test with coverage
      working-directory: api-ts
      # デフォルトのbash -e {0}にはpipefailが付かず、teeを挟むとpnpmの失敗が
      # ステップの失敗として伝播しない（teeの終了コードで上書きされる）ため明示する。
      run: |
        set -o pipefail
        pnpm -r test:coverage | tee /tmp/test-coverage.log

    - name: Add coverage summary to job summary
      if: always()
      run: |
        {
          echo '## Coverage Summary'
          echo '```'
          grep -E 'RUN.*api-ts/src|Coverage summary|Statements|Branches|Functions|Lines {8}:|^====' /tmp/test-coverage.log
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
