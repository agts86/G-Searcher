# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - line-web-hook-api

on:
  push:
    branches:
      - develop
    paths:
      - 'API/**'    
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - run: dotnet restore ./API/LineWebHookAPI/LineWebHookAPI.csproj
      - run: dotnet build ./API/LineWebHookAPI/LineWebHookAPI.csproj -c Release --no-restore
      - run: >
          dotnet publish ./API/LineWebHookAPI/LineWebHookAPI.csproj -c Release
          -r win-x64 --self-contained true
          /p:PublishSingleFile=true
          /p:IncludeAllContentForSelfExtract=true
          -o ./publish
      - uses: actions/upload-artifact@v4
        with: { name: drop, path: ./publish/** }
  deploy:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with: { name: drop, path: ./publish }
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_... }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_... }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_... }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: line-web-hook-api
          slot-name: Production
          package: ./publish

  wake-up:
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    steps:
      - name: Ping health endpoint with retries
        env:
          URL: ${{ secrets.KEEPALIVE_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "KEEPALIVE_URL secret is not set"; exit 1
          fi
          echo "Pinging: $URL"
          for i in 1 2 3; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$URL" || true)
            if [ "$CODE" = "200" ] || [ "$CODE" = "204" ]; then
              echo "OK (HTTP $CODE)"; exit 0
            fi
            echo "Attempt $i failed (HTTP $CODE). Retrying in 10s..."
            sleep 10
          done
          echo "All retries failed"; exit 1


