# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - line-web-hook-api

on:
  push:
    branches:
      - develop
    paths:
      - 'API/**'    
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build ./API/LineWebHookAPI/LineWebHookAPI.csproj --configuration Release

      - name: dotnet publish
        run: >
          dotnet publish ./API/LineWebHookAPI/LineWebHookAPI.csproj -c Release
          -r win-x64 --self-contained true
          /p:PublishSingleFile=true
          /p:IncludeAllContentForSelfExtract=true
          -o ./publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_66E085E0FB724F6B8D456EC67F2148F7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_93108C5E37134A96B342478DAA227AC5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AB1DAF1410C34B939B79B31E4779DAF7 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'line-web-hook-api'
          slot-name: 'Production'
          package: .
  wake-up:
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    steps:
      - name: Ping health endpoint with retries
        env:
          URL: ${{ secrets.KEEPALIVE_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "KEEPALIVE_URL secret is not set"; exit 1
          fi
          echo "Pinging: $URL"
          for i in 1 2 3; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$URL" || true)
            if [ "$CODE" = "200" ] || [ "$CODE" = "204" ]; then
              echo "OK (HTTP $CODE)"; exit 0
            fi
            echo "Attempt $i failed (HTTP $CODE). Retrying in 10s..."
            sleep 10
          done
          echo "All retries failed"; exit 1


