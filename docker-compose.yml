services:
  ui:
    container_name: ui
    build:
      context: ./UI
      dockerfile: dockerfile.dev
    working_dir: /app
    command: >
      sh -c "mkdir -p /tmp/linewebhook-cert &&
      openssl pkcs12 -in /tmp/linewebhook-cert/WslLocalhost.pfx -nokeys -cacerts -passin pass:WslLocalhost -out /tmp/linewebhook-cert/localhost-dev-root-ca.pem &&
      pnpm install --store-dir /tmp/pnpm-store &&
      NODE_EXTRA_CA_CERTS=/tmp/linewebhook-cert/localhost-dev-root-ca.pem pnpm exec next dev -p 3000 -H 0.0.0.0"
    environment:
      - TZ=Asia/Tokyo
      - NODE_ENV=development
      - CI=true
      - API_BASE_URL=https://localhost:5001
    network_mode: "host"
    volumes:
      - ./UI:/app
      - ui_node_modules:/app/node_modules
      - ${USERPROFILE}/.aspnet/https/WslLocalhost.pfx:/tmp/linewebhook-cert/WslLocalhost.pfx:ro
    depends_on:
      - backend

  backend:
    container_name: backend
    build:
      context: ./API
      dockerfile: Dockerfile.dev
    environment:
      - TZ=Asia/Tokyo
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://localhost:5001;http://localhost:5000
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/WslLocalhost.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=WslLocalhost
      - ConnectionStrings__PostgreSQLConnection=Host=localhost;Database=postgres;Username=postgres;Password=postgres;SSL Mode=Disable;Trust Server Certificate=true
    network_mode: "host"
    volumes:
      - ${USERPROFILE}/.aspnet/https:/https:ro
    depends_on:
      - postgres

  api-ts:
    container_name: api-ts
    build:
      context: ./api-ts
      dockerfile: Dockerfile.dev
    working_dir: /app/src/host
    command: >
      sh -c "cd /app &&
      pnpm install --store-dir /tmp/pnpm-store &&
      pnpm --filter @api-ts/tables exec prisma generate &&
      pnpm --filter @api-ts/host exec tsx watch src/main.ts"
    environment:
      - TZ=Asia/Tokyo
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres?schema=public&sslmode=disable
      - JWT_SECRET=DevelopmentOnlyJwtKeyMustBeAtLeast32Chars
      - JWT_ISSUER=LineWebHookAPI
      - JWT_AUDIENCE=LineWebHookAdmin
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
      - ACCESS_TOKEN_EXPIRES_MINUTES=15
      - REFRESH_TOKEN_EXPIRES_DAYS=7
    network_mode: "host"
    volumes:
      - ./api-ts:/app
    depends_on:
      - postgres

  postgres:
    container_name: postgres
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data:
  ui_node_modules:
