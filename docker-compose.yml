version: "3.8"
services:
  backend:
    container_name: backend
    build:
      context: ./API
      dockerfile: Dockerfile.dev
    ports:
      - 5000:5000
      - 5001:5001
    environment:
      - TZ=Asia/Tokyo
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://localhost:5001;http://localhost:5000
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/WslLocalhost.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=WslLocalhost
      - ConnectionStrings__PostgreSQLConnection=Host=localhost;Database=postgres;Username=postgres;Password=postgres;SSL Mode=Disable;Trust Server Certificate=true
    network_mode: "host"
    volumes:
      - /${USERPROFILE}/.aspnet/https:/https:ro
    depends_on:
      - postgres

  postgres:
    container_name: postgres
    image: postgres:latest
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data:
